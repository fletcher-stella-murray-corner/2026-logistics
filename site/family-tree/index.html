<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree — Murray Corner 2026</title>
<style>
/* Shared site-wide chrome — inlined into every page at build time (see
   technical.md -> Where CSS and JS changes go). Nav bar, color variables,
   and base typography, per brand-guidelines.md -> Visual Identity. */
:root {
  --primary: #1b4965;   /* deep tide blue */
  --secondary: #5fa8a0; /* sea glass */
  --accent: #e8d9b5;    /* driftwood sand (= Afternoon, see timeline/shared.css) */
  --bg: #faf8f4;        /* off-white — the fixed "paper card" color (structure/room boxes), never the atmosphere */
  --text: #23282b;      /* charcoal */
  --mist: #edf1f2;      /* the one color that reads clearly on a DARK background (Night) */
  --grove: #dde8d4;     /* soft sage green — background for anything that isn't a specific day/quarter: see body below */
  --border: #ddd6c4;
  --nav-height: 3.75rem;
}
* { box-sizing: border-box; }
html { color-scheme: light; overflow-x: hidden; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  /* --grove, not --bg — the page itself (Family Tree, Attendees, and the
     Timeline's own intro screen before you've scrolled into a day) is a
     fifth "place" alongside the four day-quarter colors, not a plain
     white default. --bg stays reserved for the structure/room "paper
     cards" that stay the same regardless of time of day or page (see
     timeline/shared.css) — a genuinely different job from the page
     background, so it needed its own variable rather than reusing this
     one for both. */
  background: var(--grove);
  color: var(--text);
  margin: 0;
  padding: 0 1.25rem 3rem;
  max-width: 760px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.5;
}
.site-nav {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  min-height: var(--nav-height);
  padding: 0.5rem 0;
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 0;
  /* --quarter-bg is set (and overridden per data-quarter) only by the
     Timeline feature's own shared.css, which is only ever inlined into
     site/index.html — falls back to --grove (this page's own background,
     see body above) on every other page, and on the Timeline itself
     before scrolling into any quarter. No transition here on purpose:
     timeline/shared.js continuously recomputes --quarter-bg on scroll
     (matching the exact color the canvas shows right at the nav's own
     bottom edge, not just a discrete swap — see that file), and a
     `transition: background-color` declared alongside updates that land
     faster than the transition's own duration gets stuck chasing a
     moving target instead of ever settling — confirmed by testing
     (removing the transition made the color update immediately and
     correctly; keeping it left the color frozen at its very first value
     indefinitely). The JS already provides its own smoothing by
     recomputing every scroll frame, so a CSS transition on top is
     redundant even where it doesn't misbehave.

     --nav-text picks the one BEST-contrast text color for whatever
     --quarter-bg currently is — default here is --primary, since every
     background this ever falls back to (--grove, and three of the four
     day-quarter colors) is light; timeline/shared.css overrides it to
     --mist only for Night, the one dark background. Every nav item reads
     this one variable (see the rule below and .cq-day/.cq-date/
     .jump-now-toggle/.run-toggle in timeline/shared.css) rather than
     each picking its own color independently — that's what let three
     items end up teal and two end up primary/bold with no visible logic
     to it. Role (title vs. label vs. action) is expressed by weight and
     size instead, not by a different hue. */
  --nav-text: var(--primary);
  background: var(--quarter-bg, var(--grove));
  z-index: 10;
}
.site-nav a, .site-nav strong {
  text-decoration: none;
  color: var(--nav-text);
  font-weight: 600;
  font-size: 1.05rem;
}
/* The one deliberate exception: the site's brand/home link ("Murray
   Corner 2026"), always the nav's first item on every page — bolder
   than everything else, but the SAME --nav-text color (not a separate
   hue), so it still stays legible against Night without needing its own
   override. */
.site-nav > a:first-child {
  font-weight: 700;
}
h1, h2, h3 { color: var(--primary); }
a { color: var(--secondary); }

/* Family-tree feature — inlined into site/family-tree/index.html at build
   time. Generation-grouped layout: couples paired, children nested below. */
.tree-title { margin-bottom: 0.25rem; }
.tree-subtitle { color: var(--secondary); margin-top: 0; margin-bottom: 2rem; }

.generation { margin-bottom: 1.5rem; }
.family-unit { margin-bottom: 1rem; }
.couple { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.person {
  display: inline-block;
  padding: 0.4rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
}
/* An attending person's box is a link to their Attendees page — the sole
   entry point to that feature (see family-tree/scripts/build.py ->
   render_person()). Reset link defaults so it still reads as a plain box,
   not a typical blue underlined link; a subtle border-color change on
   hover/focus is the only affordance it's clickable, per
   brand-guidelines.md's plain/unfussy, no-decoration visual language. A
   not-attending person has no such page, so stays a plain <span> with no
   hover treatment. */
a.person {
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}
a.person:hover, a.person:focus-visible {
  border-color: var(--secondary);
}
.person-name { display: block; }
/* Small caption under the name, only shown for a non-default state (see
   requirements/public.md -> Family Tree -> Layout) — the everyday case
   (attending, facts collected) is the plain box above with no caption,
   so a caption always means "look here," not decoration. */
.person-status {
  display: block;
  margin-top: 0.15rem;
  font-size: 0.72rem;
  font-style: italic;
  color: var(--secondary);
}
/* Married in (joined by marriage/partnership, not a blood descendant) —
   dashed AND colored border, plus the "Married in" caption above, so it
   reads clearly even for someone who can't recall what a dashed border
   means on its own. */
.person.married-in {
  border-style: dashed;
  border-color: var(--secondary);
}
/* Attending, but no travel.json entry yet — sand tint (brand-guidelines.md's
   documented use for accent: "day-card background tint") flags it as
   still-open without introducing a new color or an icon. */
.person.status-needed {
  background: var(--accent);
}
.person.status-not-attending {
  opacity: 0.55;
}
.couple-joiner { color: var(--secondary); }
.empty-hint { color: #8a8378; font-size: 0.95rem; font-style: italic; }
.children {
  margin: 0.5rem 0 0 1.5rem;
  padding-left: 1rem;
  border-left: 2px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

</style>
</head>
<body>

</main>
</body>
</html>
