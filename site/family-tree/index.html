<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Family Tree — Murray Corner 2026</title>
<style>
/* Shared site-wide chrome — inlined into every page at build time (see
   technical.md -> Where CSS and JS changes go). Nav bar, color variables,
   and base typography, per brand-guidelines.md -> Visual Identity. */
:root {
  --primary: #1b4965;   /* deep tide blue */
  --secondary: #5fa8a0; /* sea glass */
  --accent: #e8d9b5;    /* driftwood sand */
  --bg: #faf8f4;
  --text: #23282b;
  --border: #ddd6c4;
  --nav-height: 3.75rem;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 0 1.25rem 3rem;
  max-width: 760px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.5;
}
.site-nav {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  min-height: var(--nav-height);
  padding: 0.5rem 0;
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}
.site-nav a, .site-nav strong {
  text-decoration: none;
  color: var(--primary);
  font-weight: 600;
  font-size: 1.05rem;
}
.site-nav strong.active { color: var(--secondary); }
h1, h2, h3 { color: var(--primary); }
a { color: var(--secondary); }

/* Family-tree feature — inlined into site/family-tree/index.html at build
   time. Generation-grouped layout: couples paired, children nested below. */
.tree-title { margin-bottom: 0.25rem; }
.tree-subtitle { color: var(--secondary); margin-top: 0; margin-bottom: 2rem; }

.generation { margin-bottom: 1.5rem; }
.family-unit { margin-bottom: 1rem; }
.couple { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
.person {
  display: inline-block;
  padding: 0.4rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
}
/* An attending person's box is a link to their Attendees page — the sole
   entry point to that feature (see family-tree/scripts/build.py ->
   render_person()). Reset link defaults so it still reads as a plain box,
   not a typical blue underlined link; a subtle border-color change on
   hover/focus is the only affordance it's clickable, per
   brand-guidelines.md's plain/unfussy, no-decoration visual language. A
   not-attending person has no such page, so stays a plain <span> with no
   hover treatment. */
a.person {
  text-decoration: none;
  color: inherit;
  cursor: pointer;
}
a.person:hover, a.person:focus-visible {
  border-color: var(--secondary);
}
.person-name { display: block; }
/* Small caption under the name, only shown for a non-default state (see
   requirements/public.md -> Family Tree -> Layout) — the everyday case
   (attending, facts collected) is the plain box above with no caption,
   so a caption always means "look here," not decoration. */
.person-status {
  display: block;
  margin-top: 0.15rem;
  font-size: 0.72rem;
  font-style: italic;
  color: var(--secondary);
}
/* Married in (joined by marriage/partnership, not a blood descendant) —
   dashed AND colored border, plus the "Married in" caption above, so it
   reads clearly even for someone who can't recall what a dashed border
   means on its own. */
.person.married-in {
  border-style: dashed;
  border-color: var(--secondary);
}
/* Attending, but no travel.json entry yet — sand tint (brand-guidelines.md's
   documented use for accent: "day-card background tint") flags it as
   still-open without introducing a new color or an icon. */
.person.status-needed {
  background: var(--accent);
}
.person.status-not-attending {
  opacity: 0.55;
}
.couple-joiner { color: var(--secondary); }
.empty-hint { color: #8a8378; font-size: 0.95rem; font-style: italic; }
.children {
  margin: 0.5rem 0 0 1.5rem;
  padding-left: 1rem;
  border-left: 2px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

</style>
</head>
<body>
<nav class="site-nav"><a href="../index.html">Timeline</a><strong class="active">Tree</strong></nav>
<h1 class="tree-title">Family Tree</h1>
<p class="tree-subtitle">Where everyone fits</p>
<main>
<div class="generation"><div class="family-unit"><div class="couple"><span class="person status-not-attending"><span class="person-name">Fletcher</span><span class="person-status">Not attending</span></span><span class="couple-joiner">&amp;</span><span class="person status-not-attending"><span class="person-name">Stella</span><span class="person-status">Not attending</span></span></div><div class="children"><div class="family-unit"><div class="couple"><span class="person status-not-attending"><span class="person-name">Jesse</span><span class="person-status">Not attending</span></span><span class="couple-joiner">&amp;</span><span class="person married-in status-not-attending"><span class="person-name">Donald</span><span class="person-status">Married in · Not attending</span></span></div><div class="children"><div class="family-unit"><div class="couple"><a class="person status-needed" href="../attendees/5.html"><span class="person-name">Jim S</span><span class="person-status">Collecting facts</span></a><span class="couple-joiner">&amp;</span><a class="person married-in status-needed" href="../attendees/6.html"><span class="person-name">Helen S</span><span class="person-status">Married in · Collecting facts</span></a></div><div class="children"><div class="family-unit"><div class="couple"><a class="person status-needed" href="../attendees/7.html"><span class="person-name">David S</span><span class="person-status">Collecting facts</span></a><span class="couple-joiner">&amp;</span><a class="person married-in status-needed" href="../attendees/8.html"><span class="person-name">Rachel</span><span class="person-status">Married in · Collecting facts</span></a></div></div></div></div></div></div></div></div></div>
</main>
</body>
</html>
