<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helen S — Murray Corner 2026</title>
<style>
/* Shared site-wide chrome — inlined into every page at build time (see
   technical.md -> Where CSS and JS changes go). Nav bar, color variables,
   and base typography, per brand-guidelines.md -> Visual Identity. */
:root {
  --primary: #1b4965;   /* deep tide blue */
  --secondary: #5fa8a0; /* sea glass */
  --accent: #e8d9b5;    /* driftwood sand */
  --bg: #faf8f4;
  --text: #23282b;
  --border: #ddd6c4;
  --nav-height: 3.75rem;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 0 1.25rem 3rem;
  max-width: 760px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.5;
}
.site-nav {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  min-height: var(--nav-height);
  padding: 0.5rem 0;
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}
.site-nav a, .site-nav strong {
  text-decoration: none;
  color: var(--primary);
  font-weight: 600;
  font-size: 1.05rem;
}
.site-nav strong.active { color: var(--secondary); }
h1, h2, h3 { color: var(--primary); }
a { color: var(--secondary); }

/* Attendees feature — inlined into site/attendees/*.html at build time.
   One page per attending person summarizing their own arrival/departure/
   room facts (see requirements/public.md -> Attendees). No index page —
   a person's page is reached by clicking them in the Family Tree, or via
   the "Detail" link in the Timeline's "Folks ▾" disclosure. */
.attendees-title { margin-bottom: 0.25rem; }

/* Every row (Arrival, Sleeping, Working from, Departure, Driving — see
   fact_row() in attendees/scripts/build.py) renders through the same
   three-column shape, so the date always leads in the same position
   instead of sometimes first and sometimes buried mid-string: a
   fixed-width date column, a short label, then the detail filling the
   rest. flex-wrap lets the date drop to its own line on a narrow phone
   screen without losing its "always first" position. */
.fact-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: 0.7rem;
  row-gap: 0.1rem;
  margin: 0.6rem 0;
  font-size: 1.05rem;
}
.fact-date {
  font-weight: 700;
  color: var(--primary);
  flex: 0 0 auto;
  min-width: 9rem;
}
.fact-label {
  font-weight: 600;
  color: var(--secondary);
  flex: 0 0 auto;
  min-width: 6.5rem;
}
.fact-detail { flex: 1 1 16rem; min-width: 0; }
.attendee-pending { color: var(--secondary); font-style: italic; }

</style>
</head>
<body>
<nav class="site-nav"><a href="../index.html">Timeline</a><a href="../family-tree/index.html">Tree</a></nav>
<h1 class="attendees-title">Helen S</h1>
<main>
<p class="attendee-pending">We don’t have your travel details yet — check back soon, or let the organizers know your plans.</p>
</main>
</body>
</html>
