<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>David S — Murray Corner 2026</title>
<style>
/* Shared site-wide chrome — inlined into every page at build time (see
   technical.md -> Where CSS and JS changes go). Nav bar, color variables,
   and base typography, per brand-guidelines.md -> Visual Identity. */
:root {
  --primary: #1b4965;   /* deep tide blue */
  --secondary: #5fa8a0; /* sea glass */
  --accent: #e8d9b5;    /* driftwood sand */
  --bg: #faf8f4;
  --text: #23282b;
  --border: #ddd6c4;
  --nav-height: 3.75rem;
}
* { box-sizing: border-box; }
html { color-scheme: light; }
body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 0 1.25rem 3rem;
  max-width: 760px;
  margin-left: auto;
  margin-right: auto;
  line-height: 1.5;
}
.site-nav {
  display: flex;
  align-items: center;
  gap: 1.25rem;
  min-height: var(--nav-height);
  padding: 0.5rem 0;
  border-bottom: 2px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}
.site-nav a, .site-nav strong {
  text-decoration: none;
  color: var(--primary);
  font-weight: 600;
  font-size: 1.05rem;
}
.site-nav strong.active { color: var(--secondary); }
h1, h2, h3 { color: var(--primary); }
a { color: var(--secondary); }

/* Facts feature — inlined into site/facts/*.html at build time. An index
   page grouping everyone into the three states this feature tracks
   (facts collected / facts needed / not attending), plus one page per
   attending person summarizing their own arrival/departure/room facts
   (see requirements/public.md -> Facts). */
.facts-title { margin-bottom: 0.25rem; }
.facts-subtitle { color: var(--secondary); margin-top: 0; margin-bottom: 2rem; }

.facts-group { margin-bottom: 1.75rem; }
.facts-group h2 { font-size: 1.05rem; margin-bottom: 0.5rem; }

.facts-list { display: flex; flex-wrap: wrap; gap: 0.5rem; list-style: none; padding: 0; margin: 0; }
.facts-list a {
  display: inline-block;
  padding: 0.4rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: #fff;
  text-decoration: none;
  color: var(--text);
}
/* Not-attending names get the same dashed-border treatment as a
   married-in person box on the Family Tree page (family-tree/shared.css
   -> .person.married-in) — reusing that "exception, not the norm" motif
   rather than inventing a new visual language for it. */
.facts-list li.not-attending-name {
  padding: 0.4rem 0.75rem;
  border: 1px dashed var(--border);
  border-radius: 6px;
  color: var(--secondary);
}
.facts-empty-hint { color: #8a8378; font-size: 0.95rem; font-style: italic; }

.fact-row { margin: 0.6rem 0; font-size: 1.05rem; }
.fact-label { font-weight: 600; color: var(--primary); margin-right: 0.4rem; }
.fact-date-range { color: var(--secondary); font-size: 0.9rem; }
.facts-pending { color: var(--secondary); font-style: italic; }

</style>
</head>
<body>
<nav class="site-nav"><a href="../index.html">Timeline</a><a href="../family-tree/index.html">Tree</a><a href="index.html">Facts</a></nav>
<h1 class="facts-title">David S’s facts</h1>
<main>
<div class="fact-row"><span class="fact-label">Arrival:</span> 2026-08-01 · Afternoon · 12pm–6pm — 🚗 Car — White Toyota Camry</div><div class="fact-row"><span class="fact-label">Sleeping:</span> Cottage — Blue Room <span class="fact-date-range">(Aug 1–3)</span></div><div class="fact-row"><span class="fact-label">Sleeping:</span> Tent — David &amp; Rachel <span class="fact-date-range">(Aug 4–13)</span></div><div class="fact-row"><span class="fact-label">Departure:</span> 2026-08-13 · Night · 12am–6am — 🚗 Car — Vehicle TBD</div>
</main>
</body>
</html>
